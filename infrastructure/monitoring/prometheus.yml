global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spaceloop-backend'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'spaceloop-postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'spaceloop-redis'
    static_configs:
      - targets: ['redis:6379']
