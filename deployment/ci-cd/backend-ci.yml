name: Backend CI

on:
  workflow_call:
  push:
    paths:
      - 'backend/**'
      - 'fraud_engine/**'
      - '*.py'
      - 'requirements*.txt'
  pull_request:
    paths:
      - 'backend/**'
      - 'fraud_engine/**'
      - '*.py'
      - 'requirements*.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: flake8 backend/ --max-line-length=120 --exit-zero

      - name: Run pytest suite
        run: pytest tests/ --exit-zero
