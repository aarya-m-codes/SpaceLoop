name: Container Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker-build:
    name: Build Multi-Service Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          push: false
          tags: spaceloop/frontend:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile
          push: false
          tags: spaceloop/backend:latest
