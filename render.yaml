services:
  - type: web
    name: spaceloop-web
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120 backend.run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spaceloop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: spaceloop-db
    databaseName: spaceloop
    user: spaceloop_user
    plan: free
